
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Software Approval Tracker V2</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <div class="container">
      <h1>Software Approval Tracker</h1>
      <p>Software inventory and version approvals</p>
    </div>
  </header>

  <main class="container">
    <section class="dashboard">
      <div class="card">
        <h2 id="softwareCount">0</h2>
        <p>Software Titles</p>
      </div>
      <div class="card approved">
        <h2 id="approvedCount">0</h2>
        <p>Approved Versions</p>
      </div>
      <div class="card pending">
        <h2 id="pendingCount">0</h2>
        <p>Pending Versions</p>
      </div>
      <div class="card denied">
        <h2 id="deniedCount">0</h2>
        <p>Denied Versions</p>
      </div>
    </section>

    <section class="panel">
      <h2>Add Software Version</h2>
      <p class="help-text">
        Existing software names are grouped automatically.
      </p>

      <form id="softwareForm">
        <div class="form-grid">
          <label>
            Software Name
            <input id="softwareName" required
                   maxlength="120"
                   placeholder="Google Chrome">
          </label>

          <label>
            Publisher
            <input id="publisher" required
                   maxlength="120"
                   placeholder="Google">
          </label>

          <label>
            Version
            <input id="version" required
                   maxlength="80"
                   placeholder="130.0.0">
          </label>

          <label>
            Approval Status
            <select id="status">
              <option value="Pending">Pending Approval</option>
              <option value="Approved">Approved</option>
              <option value="Denied">Denied</option>
            </select>
          </label>
        </div>

        <button type="submit">Add Software Version</button>
      </form>
    </section>

    <section class="panel">
      <div class="section-heading">
        <h2>Software Inventory</h2>
        <button id="exportBtn" type="button">
          Export CSV
        </button>
      </div>

      <div class="filters">
        <input id="search" type="search"
               placeholder="Search software or publisher">

        <select id="statusFilter">
          <option value="All">All Statuses</option>
          <option value="Approved">Approved</option>
          <option value="Pending">Pending Approval</option>
          <option value="Denied">Denied</option>
        </select>
      </div>

      <div id="softwareList"></div>
      <p id="emptyMessage" hidden>
        No software found. Add your first version above!
      </p>
    </section>
  </main>
</body>
</html>
